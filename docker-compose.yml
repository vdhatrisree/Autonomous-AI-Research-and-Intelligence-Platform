services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=neo4j://host.docker.internal:7687
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface